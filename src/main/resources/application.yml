server:
  port: 8080

spring:
  application:
    name: token-service
  
  datasource:
    url: jdbc:h2:file:./data/tokendb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:}
  
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

token:
  algorithm: RS256
  secret: ${TOKEN_SECRET:}
  private-key: ${TOKEN_PRIVATE_KEY:}
  public-key: ${TOKEN_PUBLIC_KEY:}
  default-expire-seconds: 3600
  max-expire-seconds: 2592000
  storage-type: memory
  
  api-key:
    enabled: true
    header-name: X-API-Key
    allowed-keys:
      - ${API_KEY:your-secure-api-key-here}
