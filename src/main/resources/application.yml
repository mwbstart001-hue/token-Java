server:
  port: 8080

spring:
  application:
    name: token-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

token:
  storage:
    type: ${TOKEN_STORAGE_TYPE:memory}
  auth:
    enabled: ${TOKEN_AUTH_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-must-be-at-least-32-characters-long-for-production}
  expiration: 3600000
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000
