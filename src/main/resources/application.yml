server:
  port: 8080

spring:
  application:
    name: token-service
  
  datasource:
    url: jdbc:h2:file:./data/tokendb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

token:
  secret: token-service-secret-key-must-be-at-least-256-bits-long-for-hs256
  default-expire-seconds: 3600
  storage-type: memory
